name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vaharo_test
          MYSQL_USER: vaharo
          MYSQL_PASSWORD: vaharo
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # CI-only throwaway values; real secrets never live in the repository.
      DATABASE_URL: mysql://vaharo:vaharo@127.0.0.1:3306/vaharo_test
      TEST_DATABASE_URL: mysql://vaharo:vaharo@127.0.0.1:3306/vaharo_test
      JWT_ACCESS_SECRET: ci-only-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci # also runs `prisma generate`
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
